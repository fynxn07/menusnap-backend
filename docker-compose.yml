services:

  postgres:
    image: postgres:16
    container_name: menusnap_postgres
    restart: always
    environment:
      POSTGRES_DB: MenuSnap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: menusnap_redis
    restart: always
    expose:
      - "6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./MenuSnap_Django
    container_name: menusnap_backend
    restart: always
    env_file:
      - MenuSnap_Django/.env
    depends_on:
      - postgres
      - redis
    expose:
      - "8000"
    volumes:
      - ./MenuSnap_Django:/app
      - ./analytics_pipeline:/app/analytics_pipeline
      - ./pyproject.toml:/app/pyproject.toml  
      - static_volume:/app/staticfiles


  notification:
    build: ./notification-service
    container_name: menusnap_notification
    restart: always
    env_file:
      - notification-service/.env
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8001"
    volumes:
      - ./notification-service:/app
      - ./pyproject.toml:/app/pyproject.toml 

  analytics:
    build: ./analytics-service
    container_name: menusnap_analytics
    restart: always
    env_file:
      - analytics-service/.env
    expose:
      - "8002"
    volumes:
      - ./analytics-service:/app


  chatbot:
    build: ./chatbot-service
    container_name: menusnap_chatbot
    restart: always
    env_file:
      - chatbot-service/.env
    depends_on:
      - backend
    expose:
      - "8000"
    volumes:
      - ./chatbot-service:/app
      - ./analytics_pipeline:/app/analytics_pipeline



  ollama:
    image: ollama/ollama:latest
    container_name: menusnap_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
     
          

  celery_worker:
    build: ./MenuSnap_Django
    container_name: menusnap_celery_worker
    restart: always
    command: celery -A accounts worker -l info
    env_file:
      - MenuSnap_Django/.env
    depends_on:
      - redis
      - postgres
      - backend
    volumes:
      - ./MenuSnap_Django:/app
      - ./analytics_pipeline:/app/analytics_pipeline 
    

  celery_beat:
    build: ./MenuSnap_Django
    container_name: menusnap_celery_beat
    restart: always
    command: celery -A accounts worker -l info
    env_file:
      - MenuSnap_Django/.env
    depends_on:
      - redis
      - postgres
      - backend
    volumes:
      - ./MenuSnap_Django:/app
      - ./analytics_pipeline:/app/analytics_pipeline 

  nginx:
    image: nginx:alpine
    container_name: menusnap_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
    depends_on:
      - backend
      - notification
      - analytics

    

volumes:
  postgres_data:
  static_volume:
  ollama_data:
